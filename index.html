<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Estoque</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #121212; color: #fff; margin: 0; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 15px; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #333; font-size: 16px; }
    input, select { background: #2a2a2a; color: #fff; }
    button { background: #2563eb; color: #fff; font-weight: bold; border: none; cursor: pointer; }
    button:active { opacity: 0.8; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
    #videoCam { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; background: #000; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="telaLogin" class="card">
    <h2>🔐 Acesso ao Sistema</h2>
    <input type="text" id="usuario" placeholder="Usuário">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
  </div>

  <!-- PAINEL PRINCIPAL -->
  <div id="painelPrincipal" style="display: none;">
    <div class="card">
      <h3>📦 Gestão de Estoque</h3>
      <button onclick="abrirLeitorQR('Saída')" style="background: #dc2626;">➖ Registrar Saída (QR Code)</button>
      <button onclick="abrirLeitorQR('Entrada')" style="background: #16a34a;">➕ Registrar Entrada (QR Code)</button>
      <button onclick="carregarDashboard()" style="background: #4f46e5;">📊 Atualizar Dashboard</button>
    </div>

    <div class="card" id="areaDashboard">
      <h4>Status do Estoque</h4>
      <p id="infoDashboard">Carregando dados...</p>
    </div>
  </div>

  <!-- MODAL DA CÂMERA AO VIVO -->
  <div id="modalCameraAoVivo" class="modal">
    <div class="modal-content">
      <h3 id="tituloCamAoVivo">📷 Escanear QR Code</h3>
      <video id="videoCam" playsinline></video>
      <canvas id="canvasAux" style="display: none;"></canvas>
      <button onclick="pararCameraETempoReal()" style="background: #6b7280; margin-top: 10px;">Cancelar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <script>
    // ⚠️ COLE AQUI A URL DO SEU GOOGLE APPS SCRIPT (/exec)
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwfiIvD_nR_uIAELI-H-Qub3WcW0CTAAF1wR9HP5XefP06k2TOwHCb1rS1UirTRdruRQg/exec";

    var streamCamera = null;
    var animacaoFrame = null;
    var qrOperacao = "";

    // CONEXÃO COM O BACKEND VIA FETCH
    function chamarBackend(acao, parametros = {}) {
      return fetch(URL_WEB_APP, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ acao: acao, parametros: parametros })
      }).then(res => res.json());
    }

    // LOGIN
    function fazerLogin() {
      var u = document.getElementById("usuario").value;
      var s = document.getElementById("senha").value;

      chamarBackend("validarLogin", { usuario: u, senha: s })
        .then(res => {
          if (res && res.sucesso) {
            document.getElementById("telaLogin").style.display = "none";
            document.getElementById("painelPrincipal").style.display = "block";
            carregarDashboard();
          } else {
            alert("❌ Login incorreto: " + (res.mensagem || "Verifique os dados"));
          }
        })
        .catch(err => alert("Erro ao conectar ao servidor."));
    }

    // CARREGAR DASHBOARD
    function carregarDashboard() {
      document.getElementById("infoDashboard").innerText = "Atualizando...";
      chamarBackend("obterDashboard")
        .then(res => {
          document.getElementById("infoDashboard").innerText = JSON.stringify(res, null, 2);
        })
        .catch(err => {
          document.getElementById("infoDashboard").innerText = "Erro ao carregar dados.";
        });
    }

    // ABRIR CÂMERA AO VIVO (SEM IRAME)
    function abrirLeitorQR(tipo) {
      qrOperacao = tipo;
      document.getElementById("tituloCamAoVivo").innerText = "📷 Escaneie para " + tipo;
      document.getElementById("modalCameraAoVivo").style.display = "flex";

      var video = document.getElementById("videoCam");

      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
        .then(function(stream) {
          streamCamera = stream;
          video.srcObject = stream;
          video.setAttribute("playsinline", true);
          video.play();
          animacaoFrame = requestAnimationFrame(escanearQuadroVideo);
        })
        .catch(function(err) {
          alert("❌ Não foi possível acessar a câmera: " + err.message);
          pararCameraETempoReal();
        });
    }

    // PROCESSAR QUADROS DA CÂMERA EM TEMPO REAL
    function escanearQuadroVideo() {
      var video = document.getElementById("videoCam");
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        var canvas = document.getElementById("canvasAux");
        var ctx = canvas.getContext("2d");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

        if (code && code.data) {
          var codigoLido = String(code.data).trim();
          pararCameraETempoReal();
          processarCodigoQR(codigoLido);
          return;
        }
      }
      animacaoFrame = requestAnimationFrame(escanearQuadroVideo);
    }

    // DESLIGAR CÂMERA
    function pararCameraETempoReal() {
      if (animacaoFrame) cancelAnimationFrame(animacaoFrame);
      if (streamCamera) {
        streamCamera.getTracks().forEach(track => track.stop());
        streamCamera = null;
      }
      document.getElementById("modalCameraAoVivo").style.display = "none";
    }

    // PROCESSAR O CÓDIGO ENCONTRADO
    function processarCodigoQR(codigo) {
      chamarBackend("buscarProdutoPorCodigoExato", { codigo: codigo })
        .then(produto => {
          if (produto) {
            alert("✅ Produto " + qrOperacao + ": " + JSON.stringify(produto));
          } else {
            alert("❌ Produto não encontrado para o código: " + codigo);
          }
        })
        .catch(err => alert("Erro ao buscar produto."));
    }
  </script>
</body>
</html>
