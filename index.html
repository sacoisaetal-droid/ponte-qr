<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor QR - Tempo Real</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: 0 auto;
      border: 1px solid #333;
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 15px;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 Leitor de QR Code</h2>
    <p>Aponte a câmera para o código da peça</p>
    
    <div id="reader"></div>
    
    <div id="status" class="status">Iniciando câmera...</div>
  </div>

  <script>
    // Flag para evitar múltiplos disparos simultâneos
    let processando = false;

    // Resgata os parâmetros da URL
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('returnUrl');
    const tipo = urlParams.get('tipo') || 'Saída';
    const usuario = urlParams.get('usuario') || '';

    function onScanSuccess(decodedText) {
      if (processando) return;
      processando = true;

      document.getElementById('status').innerText = "✅ Lido: " + decodedText + "\nVoltando para o App...";

      if (redirectUrl) {
        // Formata a URL de retorno de forma limpa
        const divisor = redirectUrl.includes('?') ? '&' : '?';
        const linkDestino = redirectUrl + divisor + 
          "qrCode=" + encodeURIComponent(decodedText) + 
          "&tipo=" + encodeURIComponent(tipo) + 
          "&usuario=" + encodeURIComponent(usuario);

        // Força a navegação direta e imediata sem esperar o encerramento do leitor
        window.location.replace(linkDestino);
      } else {
        alert("Código: " + decodedText + "\nURL de retorno não encontrada.");
      }
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        facingMode: "environment"
      }, 
      false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
