<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor QR - Tempo Real</title>
  <!-- Biblioteca para leitura de câmera em tempo real -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: 0 auto;
      border: 1px solid #333;
    }
    #reader {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 15px;
    }
    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 Leitor de QR Code</h2>
    <p>Aponte a câmera para o código da peça</p>
    
    <!-- ÁREA ONDE A CÂMERA DE VÍDEO APARECE -->
    <div id="reader"></div>
    
    <div id="status" class="status">Iniciando câmera...</div>
  </div>

  <script>
    // 1. Captura os parâmetros enviados pelo Apps Script
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('returnUrl');
    const tipo = urlParams.get('tipo') || 'Saída';
    const usuario = urlParams.get('usuario') || '';

    // 2. Função executada quando o QR Code é lido em tempo real
    function onScanSuccess(decodedText, decodedResult) {
      document.getElementById('status').innerText = "✅ Código lido: " + decodedText;

      // Parar o escaneamento para não ler repetidamente
      html5QrcodeScanner.clear().then(() => {
        if (redirectUrl) {
          // Redireciona de volta para o Apps Script enviando o código lido
          const destino = new URL(redirectUrl);
          destino.searchParams.set('qrCode', decodedText);
          destino.searchParams.set('tipo', tipo);
          destino.searchParams.set('usuario', usuario);
          window.location.href = destino.toString();
        } else {
          alert("Código lido: " + decodedText);
        }
      });
    }

    // 3. Inicializa o leitor de vídeo em tempo real
    const html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        facingMode: "environment" // Força o uso da câmera traseira
      }, 
      /* verbose= */ false
    );

    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
