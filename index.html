<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponte QR - Leitor de Estoque</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; max-width: 400px; margin: 0 auto; }
    input[type="file"] { display: none; }
    .btn { background: #22C55E; color: white; padding: 15px 20px; font-weight: bold; border-radius: 8px; border: none; font-size: 16px; cursor: pointer; display: block; width: 100%; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📷 Ponte Leitora de QR Code</h2>
    <p id="status">Aguardando ação...</p>
    
    <label for="cameraInput" class="btn">🚀 Abrir Câmera</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="processarFoto(this)">
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <script>
    // Pegar os parâmetros que vieram do Apps Script (URL de retorno, usuário, tipo)
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('returnUrl');
    const tipo = urlParams.get('tipo') || 'Saída';
    const usuario = urlParams.get('usuario') || '';

    document.getElementById('status').innerText = `Modo: Registrando ${tipo}`;

    function processarFoto(input) {
      if (!input.files || !input.files[0]) return;
      document.getElementById('status').innerText = "🔎 Processando imagem...";

      const arquivo = input.files[0];
      const imagem = new Image();
      const urlTemp = URL.createObjectURL(arquivo);

      imagem.onload = function() {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = imagem.width;
        canvas.height = imagem.height;
        ctx.drawImage(imagem, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);

        if (code && code.data) {
          document.getElementById('status').innerText = "✅ Código lido: " + code.data;
          
          // Redireciona de volta para o Apps Script com o código e os dados
          if (redirectUrl) {
            const destino = new URL(redirectUrl);
            destino.searchParams.set('qrCode', code.data);
            destino.searchParams.set('tipo', tipo);
            destino.searchParams.set('usuario', usuario);
            window.location.href = destino.toString();
          } else {
            alert("Código lido: " + code.data + "\n(URL de retorno não encontrada)");
          }
        } else {
          document.getElementById('status').innerText = "❌ QR Code não identificado. Tente novamente.";
        }
      };
      imagem.src = urlTemp;
    }
  </script>
</body>
</html>
